spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nearnow_db?options=-c%20TimeZone=Asia/Kolkata}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# Controls which @Profile-gated beans exist (see AdminSeedController).
# Defaults to "dev" so local/Docker development keeps working exactly
# as before with zero changes needed. A real deployment sets
# SPRING_PROFILES_ACTIVE=prod in its environment — at that point the
# seed endpoint stops existing automatically, nothing to remember.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
# Render (and most PaaS platforms) inject their own PORT environment
# variable and require the app to listen on exactly that port — a
# hardcoded 8080 would make the platform's health check fail silently,
# since traffic arrives on the platform's assigned port, not 8080.
# ${PORT:...} is checked first (wins on Render); SERVER_PORT remains a
# manual override option; 8080 is the final fallback for local dev where
# neither is set.
server.port=${PORT:${SERVER_PORT:8080}}

# Development uses local schema evolution so the whole project can run from a
# fresh laptop database without any paid migration service. The pgvector table
# is created by db/migration/V1__free_local_vector_support.sql.

# --- Auth ---
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
# 30 days — the refresh token's whole job is to let a device stay
# "logged in" across app restarts without re-entering a password every
# hour. Still fully revocable at any time via authVersion (see
# AuthService.logout) — long expiry does not mean unrevokable.
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:2592000000}

# --- Payment ---
# MOCK is the only default. No live payment provider or API key is required.
payment.mode=${PAYMENT_MODE:MOCK}

# Razorpay test-mode credentials — only used when payment.mode=RAZORPAY.
# Get free TEST keys from https://dashboard.razorpay.com/app/keys after
# switching the dashboard's toggle to "Test Mode" (top-left). Never put
# LIVE keys here in a project meant to stay free/no-real-money.
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
# Set when creating a webhook in the Razorpay dashboard (Settings > Webhooks
# > Add New Webhook). Point it at https://<your-backend>/api/payments/webhook
# and select the "payment.captured" and "payment.failed" events.
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}

# --- Mail (free Gmail SMTP, not a paid API) ---
# MAIL_USERNAME is the sending Gmail address; MAIL_APP_PASSWORD is the
# 16-character App Password Google generates (Google Account -> Security
# -> 2-Step Verification -> App passwords), NOT the real Gmail login
# password. Both live only in .env, same rule as JWT_SECRET/DB_PASSWORD.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Spring Boot auto-adds an SMTP-login health check the moment
# spring-boot-starter-mail is on the classpath. That's appropriate for
# a production alerting setup, but it means /actuator/health goes DOWN
# whenever Gmail credentials are missing/wrong/rate-limited — which
# has nothing to do with whether THIS app is healthy (DB up, disk ok).
# Disabling it here; the real signal (can we actually send an email)
# belongs in an integration test, not the liveness probe.
management.health.mail.enabled=false

# --- Self-hosted Redis ---
spring.cache.type=redis
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.cache.redis.time-to-live=600000

# --- Local semantic search ---
semantic-search.dimensions=128

# --- CORS ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080,http://10.0.2.2:8080}

# --- Monitoring (optional local tools) ---
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never

# --- Internal AI service ---
ai-service.base-url=${AI_SERVICE_BASE_URL:http://ai-service:8001}
ai-service.internal-api-key=${INTERNAL_API_KEY}

# --- Agentic compatibility aliases ---
ai.service.url=${AI_SERVICE_BASE_URL:http://ai-service:8001}
ai.internal-api-key=${INTERNAL_API_KEY}
